services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}\""]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}; do
         echo 'waiting for minio...'; sleep 2;
       done &&
       mc mb -p local/${S3__Bucket:?Set S3__Bucket in .env} || true &&
       mc anonymous set none local/${S3__Bucket:?Set S3__Bucket in .env} || true"

  runner:
    build:
      context: .
      dockerfile: ./Dockerfile.runner
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5291
      Runner__ContainerRuntime: ${Runner__ContainerRuntime:-runsc}
      Runner__TimeoutSeconds: ${Runner__TimeoutSeconds:-25}
      Runner__HeartbeatIntervalSeconds: ${Runner__HeartbeatIntervalSeconds:-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__User: ${RabbitMQ__User:?Set RabbitMQ__User in .env}
      RabbitMQ__Pass: ${RabbitMQ__Pass:?Set RabbitMQ__Pass in .env}
      RabbitMQ__VHost: ${RabbitMQ__VHost:-/}
      RabbitMQ__RunQueue: ${RabbitMQ__RunQueue:-runs}
      RabbitMQ__CancelQueue: ${RabbitMQ__CancelQueue:-run-cancel}
      RabbitMQ__ResultQueue: ${RabbitMQ__ResultQueue:-run-results}
      RabbitMQ__HeartbeatQueue: ${RabbitMQ__HeartbeatQueue:-run-heartbeats}
      RabbitMQ__RetryDelaySeconds: ${RabbitMQ__RetryDelaySeconds:-5}
      RabbitMQ__MaxRetries: ${RabbitMQ__MaxRetries:-3}
      S3__Endpoint: ${S3__Endpoint:-http://minio:9000}
      S3__Bucket: ${S3__Bucket:?Set S3__Bucket in .env}
      S3__AccessKey: ${S3__AccessKey:?Set S3__AccessKey in .env}
      S3__SecretKey: ${S3__SecretKey:?Set S3__SecretKey in .env}
      S3__UsePathStyle: ${S3__UsePathStyle:-true}
      S3__UseSignatureVersion4: ${S3__UseSignatureVersion4:-true}
    ports:
      - "5291:5291"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  compiler:
    build:
      context: .
      dockerfile: ./Dockerfile.compiler
    environment:
      Compiler__ContainerRuntime: ${Compiler__ContainerRuntime:-runsc}
      Compiler__TimeoutSeconds: ${Compiler__TimeoutSeconds:-180}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      AWS_EC2_METADATA_DISABLED: ${AWS_EC2_METADATA_DISABLED:-true}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__User: ${RabbitMQ__User:?Set RabbitMQ__User in .env}
      RabbitMQ__Pass: ${RabbitMQ__Pass:?Set RabbitMQ__Pass in .env}
      RabbitMQ__VHost: ${RabbitMQ__VHost:-/}
      RabbitMQ__CompileQueue: ${RabbitMQ__CompileQueue:-compile}
      RabbitMQ__CompileResultQueue: ${RabbitMQ__CompileResultQueue:-compile-results}
      RabbitMQ__HeartbeatQueue: ${RabbitMQ__HeartbeatQueue:-run-heartbeats}
      RabbitMQ__RetryDelaySeconds: ${RabbitMQ__RetryDelaySeconds:-5}
      RabbitMQ__MaxRetries: ${RabbitMQ__MaxRetries:-3}
      S3__Endpoint: ${S3__Endpoint:-http://minio:9000}
      S3__Bucket: ${S3__Bucket:?Set S3__Bucket in .env}
      S3__AccessKey: ${S3__AccessKey:?Set S3__AccessKey in .env}
      S3__SecretKey: ${S3__SecretKey:?Set S3__SecretKey in .env}
      S3__UsePathStyle: ${S3__UsePathStyle:-true}
      S3__UseSignatureVersion4: ${S3__UseSignatureVersion4:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:5280
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}
      Redis__Connection: ${Redis__Connection:?Set Redis__Connection in .env}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__User: ${RabbitMQ__User:?Set RabbitMQ__User in .env}
      RabbitMQ__Pass: ${RabbitMQ__Pass:?Set RabbitMQ__Pass in .env}
      RabbitMQ__VHost: ${RabbitMQ__VHost:-/}
      RabbitMQ__Queue: ${RabbitMQ__Queue:-submissions}
      RabbitMQ__RunQueue: ${RabbitMQ__RunQueue:-runs}
      RabbitMQ__CancelQueue: ${RabbitMQ__CancelQueue:-run-cancel}
      RabbitMQ__ResultQueue: ${RabbitMQ__ResultQueue:-run-results}
      RabbitMQ__HeartbeatQueue: ${RabbitMQ__HeartbeatQueue:-run-heartbeats}
      RabbitMQ__CompileQueue: ${RabbitMQ__CompileQueue:-compile}
      RabbitMQ__CompileResultQueue: ${RabbitMQ__CompileResultQueue:-compile-results}
      RabbitMQ__RetryDelaySeconds: ${RabbitMQ__RetryDelaySeconds:-5}
      RabbitMQ__MaxRetries: ${RabbitMQ__MaxRetries:-3}
      S3__Endpoint: ${S3__Endpoint:-http://minio:9000}
      S3__Bucket: ${S3__Bucket:?Set S3__Bucket in .env}
      S3__AccessKey: ${S3__AccessKey:?Set S3__AccessKey in .env}
      S3__SecretKey: ${S3__SecretKey:?Set S3__SecretKey in .env}
      S3__UsePathStyle: ${S3__UsePathStyle:-true}
      S3__UseSignatureVersion4: ${S3__UseSignatureVersion4:-true}
    ports:
      - "5280:5280"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile.worker
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}
      Redis__Connection: ${Redis__Connection:?Set Redis__Connection in .env}
      RabbitMQ__Host: ${RabbitMQ__Host:-rabbitmq}
      RabbitMQ__User: ${RabbitMQ__User:?Set RabbitMQ__User in .env}
      RabbitMQ__Pass: ${RabbitMQ__Pass:?Set RabbitMQ__Pass in .env}
      RabbitMQ__VHost: ${RabbitMQ__VHost:-/}
      RabbitMQ__Queue: ${RabbitMQ__Queue:-submissions}
      RabbitMQ__RunQueue: ${RabbitMQ__RunQueue:-runs}
      RabbitMQ__CancelQueue: ${RabbitMQ__CancelQueue:-run-cancel}
      RabbitMQ__ResultQueue: ${RabbitMQ__ResultQueue:-run-results}
      RabbitMQ__HeartbeatQueue: ${RabbitMQ__HeartbeatQueue:-run-heartbeats}
      RabbitMQ__CompileQueue: ${RabbitMQ__CompileQueue:-compile}
      RabbitMQ__CompileResultQueue: ${RabbitMQ__CompileResultQueue:-compile-results}
      RabbitMQ__RetryDelaySeconds: ${RabbitMQ__RetryDelaySeconds:-5}
      RabbitMQ__MaxRetries: ${RabbitMQ__MaxRetries:-3}
      S3__Endpoint: ${S3__Endpoint:-http://minio:9000}
      S3__Bucket: ${S3__Bucket:?Set S3__Bucket in .env}
      S3__AccessKey: ${S3__AccessKey:?Set S3__AccessKey in .env}
      S3__SecretKey: ${S3__SecretKey:?Set S3__SecretKey in .env}
      S3__UsePathStyle: ${S3__UsePathStyle:-true}
      S3__UseSignatureVersion4: ${S3__UseSignatureVersion4:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
