services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algoplatform
      POSTGRES_PASSWORD: algopass
      POSTGRES_DB: algoplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "devpass"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: ./AlgoPlatform.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5280

      # строка подключения к БД (ИМЕННО так—через ConnectionStrings__DefaultConnection,
      # потому что в Program.cs ты читаешь DefaultConnection)
      ConnectionStrings__DefaultConnection: Host=postgres;Username=postgres;Password=777buba777;Database=AlgoPlatform

      # redis для быстрых статусов/кеша
      Redis__Connection: redis:6379,password=devpass,abortConnect=false
    ports:
      - "5280:5280"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
